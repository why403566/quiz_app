name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o quiz_app.zip -d. || true
          if [ -f quiz_app/pubspec.yaml ]; then cp -rf quiz_app/*.; fi
          if [ -f quiz_app/quiz_app/pubspec.yaml ]; then cp -rf quiz_app/quiz_app/*.; fi
          rm -rf quiz_app quiz_app.zip || true
      - name: Fix pubspec and main.dart
        run: |
          cat > pubspec.yaml << 'EOF'
          name: quiz_app
          description: A simple Quiz App
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
          flutter:
            uses-material-design: true
          EOF
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main(){runApp(const QuizApp());}
          class QuizApp extends StatelessWidget{
            const QuizApp({super.key});
            @override Widget build(BuildContext context){
              return const MaterialApp(debugShowCheckedModeBanner:false, home: QuizScreen());
            }
          }
          class QuizScreen extends StatefulWidget{
            const QuizScreen({super.key});
            @override State<QuizScreen> createState()=> _QuizScreenState();
          }
          class _QuizScreenState extends State<QuizScreen>{
            int q=0,score=0;
            final list=[
              {"q":"Pakistan ka Capital?","o":["Karachi","Lahore","Islamabad"],"a":2},
              {"q":"Flutter kis ka hai?","o":["Google","Meta"],"a":0},
              {"q":"2+2=?","o":["3","4"],"a":1},
            ];
            void check(int i){
              if(i==list[q]["a"])score++;
              if(q<list.length-1){setState(()=>q++);}else{
                showDialog(context:context, builder:(_)=>AlertDialog(title:Text("Score $score/${list.length}"), actions:[TextButton(onPressed:(){Navigator.pop(context);setState((){q=0;score=0;});}, child: const Text("Restart"))]));
              }
            }
            @override Widget build(BuildContext context){
              return Scaffold(appBar:AppBar(title:const Text("Quiz App")), body:Padding(padding:const EdgeInsets.all(16), child:Column(children:[Text(list[q]["q"].toString(), style:const TextStyle(fontSize:20,fontWeight:FontWeight.bold)), const SizedBox(height:20),...List.generate((list[q]["o"] as List).length, (i)=>Container(margin:const EdgeInsets.only(bottom:10), width:double.infinity, child:ElevatedButton(onPressed:()=>check(i), child:Text(list[q]["o"][i].toString())))), Text("Score: $score")])));
            }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
