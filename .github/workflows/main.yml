name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          unzip -o quiz_app.zip
          # Agar quiz_app_temp bana hai to usko bahar lao
          if [ -d "quiz_app_temp" ]; then
            cp -rf quiz_app_temp/*.
            rm -rf quiz_app_temp
          fi
          # Agar quiz_app folder bana hai to usko bhi bahar lao
          if [ -d "quiz_app" ] && [ -f "quiz_app/pubspec.yaml" ]; then
            cp -rf quiz_app/*.
            rm -rf quiz_app
          fi
          rm -f quiz_app.zip
          ls -la
      - name: Fix build.gradle.kts
        run: |
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.example.quiz_app"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = "27.0.12077973"
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              defaultConfig {
                  applicationId = "com.example.quiz_app"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
