name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract correctly
        run: |
          rm -rf lib pubspec.yaml android || true
          unzip -o quiz_app.zip -d.
          # zip ke andar ka folder bahar lao
          if [ -f quiz_app/pubspec.yaml ]; then cp -rf quiz_app/*.; fi
          if [ -f quiz_app/quiz_app/pubspec.yaml ]; then cp -rf quiz_app/quiz_app/*.; fi
          rm -rf quiz_app quiz_app.zip || true
          ls -la
          cat pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: quiz-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
