name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          rm -rf quiz_app_temp
          mkdir quiz_app_temp
          unzip -o quiz_app.zip -d quiz_app_temp
          # pubspec.yaml kahan hai dhondo
          PUB_PATH=$(find quiz_app_temp -name "pubspec.yaml" | head -n 1)
          echo "Found at: $PUB_PATH"
          PROJECT_DIR=$(dirname "$PUB_PATH")
          echo "Project dir: $PROJECT_DIR"
          cp -r $PROJECT_DIR/*.
          cp -r $PROJECT_DIR/.*. 2>/dev/null || true
          rm -rf quiz_app_temp quiz_app.zip quiz_app
          ls -la
      - name: Fix build.gradle.kts
        run: |
          cat > android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          android {
              namespace = "com.example.quiz_app"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = "27.0.12077973"
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              defaultConfig {
                  applicationId = "com.example.quiz_app"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          flutter {
              source = "../.."
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
