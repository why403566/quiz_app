name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: |
          unzip -o quiz_app.zip -d. || true
          rm -rf android
          flutter create. --platforms=android
          mkdir -p lib
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          void main()=>runApp(const MaterialApp(home:Quiz()));
          class Quiz extends StatefulWidget{const Quiz({super.key});@override State<Quiz> createState()=>_Q();}
          class _Q extends State<Quiz>{int i=0,s=0; final q=[{"q":"Pakistan Capital?","o":["KHI","LHR","ISB"],"a":2},{"q":"2+2?","o":["3","4"],"a":1}]; void n(int v){if(v==q[i]["a"])s++;if(i<q.length-1){setState(()=>i++);}else{showDialog(context:context,builder:(_)=>AlertDialog(title:Text("Score $s"),actions:[TextButton(onPressed:(){Navigator.pop(context);setState((){i=0;s=0;});},child:Text("Restart"))])));} @override Widget build(BuildContext c){return Scaffold(appBar:AppBar(title:Text("Quiz App")),body:Padding(padding:EdgeInsets.all(16),child:Column(children:[Text(q[i]["q"].toString(),style:TextStyle(fontSize:22,fontWeight:FontWeight.bold)),SizedBox(height:20),...List.generate((q[i]["o"] as List).length,(x)=>Container(width:double.infinity,margin:EdgeInsets.only(bottom:10),child:ElevatedButton(onPressed:()=>n(x),child:Text(q[i]["o"][x].toString())))),Text("Score: $s")])));}}
          EOF
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
